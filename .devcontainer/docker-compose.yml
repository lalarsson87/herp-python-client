version: '3.8'

services:
  # Main development container
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      # Mount the entire workspace
      - ..:/workspace:cached
      # Preserve bash history
      - .bash_history:/root/.bash_history
      # Cache for faster rebuilds
      - pip-cache:/root/.cache/pip
      - pytest-cache:/workspace/.pytest_cache
    environment:
      # Python settings
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      # Development mode
      DEVELOPMENT: 1
      # Load .env file
      ENV_FILE: /workspace/.env
    command: sleep infinity
    networks:
      - herp-dev

  # Optional: PostgreSQL for local testing (if needed in future)
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_USER: herp
  #     POSTGRES_PASSWORD: herp_dev_password
  #     POSTGRES_DB: herp_test
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - herp-dev
  #   ports:
  #     - "5432:5432"

  # Optional: Redis for caching tests (if needed in future)
  # redis:
  #   image: redis:7-alpine
  #   networks:
  #     - herp-dev
  #   ports:
  #     - "6379:6379"

networks:
  herp-dev:
    driver: bridge

volumes:
  pip-cache:
  pytest-cache:
  # postgres-data:
