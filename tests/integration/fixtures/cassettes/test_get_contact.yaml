        / AI実装から組織改善まで完遂する圧倒的推進力\r\n\r\n■推薦文 \r\nジョーンズ様は、日本国内のIT業界で12年以上のキャリアを持つ、ビジネスとエンジニアリングの懸け橋となるプロダクトマネージャー（PdM）です。直近のデジタル・ウィル株式会社では、海外のリモート開発チームを統括し、アジャイル（スクラム）開発を牽引。AIを活用したユーザーオンボーディングの改善提案や、要件定義からロードマップ策定まで、プロダクト成長の全工程をリードしてきました。ClickUpやLinear、JIRAを駆使した高度なプロジェクト管理能力に加え、過去のオペレーションマネージャー経験に基づくデータドリブンな意思決定が最大の強みです。\r\n\r\n■お人柄
        \r\n非常に誠実かつプロフェッショナルな姿勢をお持ちです。前職の破産という困難な状況下でも、冷静に自身のスキルを整理し、次なる貢献の場を求める前向きなエネルギーがあります。また、過去に人材紹介のマネージャーや50名規模の拠点ITサポートを経験していることから、対人コミュニケーション能力が極めて高く、多様なステークホルダーを巻き込みながらプロジェクトを完遂するリーダーシップを備えています。\r\n\r\n■日本語力
        \r\n流暢レベルの日本語力をお持ちです。複雑な業務上の議論や要件定義、社内調整においても言語の壁を感じさせることはありません。英語ネイティブとしての発信力と、日本文化への深い理解を併せ持つ稀有な人材です。\r\n\r\n■転職理由
        \r\n前職の企業破産に伴う、やむを得ない退職によるものです。現在はこれまでのPdM経験を軸に、生成AIなどの先端技術を積極的に取り入れ、社会に価値を提供するプロダクトに腰を据えて貢献したいという強い意欲をお持ちです。\r\n\r\n■その他
