version: '3.8'

services:
  # Main HERP development environment
  herp-dev:
    build:
      context: ../..
      dockerfile: development/herp/Dockerfile
    container_name: herp-dev
    volumes:
      # Mount source code for live development
      - ../../development/herp:/app/development/herp
      - ../../knowledge-base:/app/knowledge-base
      # Persist data directory
      - herp-data:/app/development/herp/data
      # Persist pytest cache
      - pytest-cache:/app/development/herp/.pytest_cache
    environment:
      # Load from .env file (create from .env.example)
      - HERP_API_KEY=${HERP_API_KEY}
      - HERP_API_BASE_URL=${HERP_API_BASE_URL:-https://public-api.herp.cloud/hire/public}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - NOTION_CANDIDATES_DB_ID=${NOTION_CANDIDATES_DB_ID}
      - PYTHONPATH=/app/src:/app
    working_dir: /app/development/herp
    stdin_open: true
    tty: true
    networks:
      - herp-network

  # PostgreSQL for integration testing (optional)
  postgres:
    image: postgres:16-alpine
    container_name: herp-postgres
    environment:
      POSTGRES_USER: herp_test
      POSTGRES_PASSWORD: herp_test_password
      POSTGRES_DB: herp_test
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - herp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herp_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mock HERP API server (for isolated testing)
  herp-mock-api:
    build:
      context: ../..
      dockerfile: development/herp/Dockerfile
    container_name: herp-mock-api
    command: python -m tests.mocks.herp_api_server
    ports:
      - "8001:8001"
    volumes:
      - ../../development/herp:/app/development/herp
      - ../../knowledge-base:/app/knowledge-base
    environment:
      - PYTHONPATH=/app/src:/app
    working_dir: /app/development/herp
    networks:
      - herp-network
    depends_on:
      - postgres

  # Mock Notion API server (for isolated testing)
  notion-mock-api:
    build:
      context: ../..
      dockerfile: development/herp/Dockerfile
    container_name: notion-mock-api
    command: python -m tests.mocks.notion_api_server
    ports:
      - "8002:8002"
    volumes:
      - ../../development/herp:/app/development/herp
      - ../../knowledge-base:/app/knowledge-base
    environment:
      - PYTHONPATH=/app/src:/app
    working_dir: /app/development/herp
    networks:
      - herp-network
    depends_on:
      - postgres

networks:
  herp-network:
    driver: bridge

volumes:
  herp-data:
    driver: local
  postgres-data:
    driver: local
  pytest-cache:
    driver: local
