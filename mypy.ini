[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
disallow_any_generics = False
check_untyped_defs = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = False
warn_no_return = True
strict_equality = False
ignore_missing_imports = True
# Allow untyped calls to avoid "no-any-return" errors
disallow_untyped_calls = False
# Allow Any expressions to reduce noise
disallow_any_expr = False
# Disable specific error codes that create noise
disable_error_code = attr-defined,union-attr,arg-type,misc,abstract,call-arg,var-annotated,return-value,assignment

[mypy-tests.*]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-src.core.herp.models]
ignore_errors = True

[mypy-src.core.cache.*]
disallow_untyped_defs = False

[mypy-src.core.observability.*]
disallow_untyped_defs = False

[mypy-src.core.herp.query_dsl]
disallow_untyped_defs = False
warn_return_any = False

[mypy-src.core.herp.search]
warn_return_any = False

[mypy-src.core.herp.events.*]
disallow_untyped_defs = False
warn_return_any = False

[mypy-src.core.herp.webhooks.*]
warn_return_any = False

[mypy-src.core.herp.mixins]
warn_return_any = False

[mypy-src.core.herp.base_client]
warn_return_any = False

[mypy-src.core.herp.async_base_client]
warn_return_any = False

[mypy-src.core.herp.batch_client]
warn_return_any = False

[mypy-src.core.herp.async_batch_client]
warn_return_any = False

[mypy-src.core.herp.candidates]
warn_return_any = False

[mypy-src.core.herp.async_candidates]
warn_return_any = False

[mypy-src.core.herp.*]
warn_return_any = False
